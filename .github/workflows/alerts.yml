name: alerts

on:
  schedule:
    - cron: "8 * * * *" # hourly; GitHub may delay runs by a few minutes
  workflow_dispatch:

jobs:
  # Fetch, score, push, persist. Deliberately carries no `environment:` — when
  # the whole job was gated on github-pages, a Pages deployment stuck in
  # `waiting` blocked alerting for hours even though nothing here needs Pages.
  # Publishing is a separate job for exactly that reason.
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit state/state.json back
    concurrency:
      group: alerts-run
      cancel-in-progress: false # never interrupt a pass mid-push
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Run alert pass (fetch, score, rebuild dashboard, push Exceptional)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          RWA_ROOT: ${{ github.workspace }}
        run: rare-weather run
      - name: Persist state
        run: |
          if [ -n "$(git status --porcelain state/state.json)" ]; then
            git config user.name "rare-weather-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state/state.json
            git commit -m "chore: update opportunity state"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishing the dashboard. Failures here are visible (no continue-on-error)
  # but cannot touch alerting, and a superseded deploy is cancelled rather than
  # queued, so a hung Pages deployment self-heals on the next hourly run.
  deploy:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: alerts-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
