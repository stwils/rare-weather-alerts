name: digest

# Manual only: "send me the board now". The scheduled morning digest is sent by
# the first alert pass on or after digest_hour (see alerts.yml / run_once).
#
# Why it's no longer scheduled here: GitHub runs scheduled workflows hours late
# — measured Aug–Sep 2026, the 13:10/14:10 UTC crons landed at 16:14–19:17 UTC.
# An exact-local-hour gate therefore matched almost never, and the digest was
# silently skipped from Aug 25 to Sep 17 behind green checkmarks.
on:
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Send the board now
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          RWA_ROOT: ${{ github.workspace }}
        run: rare-weather digest
