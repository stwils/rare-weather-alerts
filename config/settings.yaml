# Rare Weather Alerts — settings
home_base:
  name: Portland, OR
  latitude: 45.5152
  longitude: -122.6784
travel_radius_drive_hours: 2.5
timezone: America/Los_Angeles

# Rarity tiers: percentile of the daily-max Quality Score distribution at a
# (Spot, Phenomenon). Floors prevent junk alerts at spots where a phenomenon
# almost never occurs (there, the p98 of daily scores can be near zero).
tiers:
  notable:
    percentile: 0.98
    floor: 0.25
  exceptional:
    percentile: 0.995
    floor: 0.35

# Per-phenomenon overrides of the tiers above. The tiers encode how often you
# want to be interrupted, and that answer isn't identical for every Phenomenon.
tier_overrides:
  # Lenticular is a discrete, unmistakable subject — when it happens it's worth
  # the drive, and the score model is conservative (it ignores wind direction
  # and stability, so it under-rates as often as it over-rates; see
  # docs/lenticular-v2.md). Lowered a notch pending that model work.
  #   notable    p98.0 -> p97.0   (7.6 -> 11.1 board days/yr)
  #   exceptional p99.5 -> p99.0  (2.1 -> 3.8 pushes/yr)
  lenticular:
    notable:
      percentile: 0.97
    exceptional:
      percentile: 0.99

# Opportunity lifecycle
merge_gap_hours: 6        # below-threshold gaps shorter than this don't split an Opportunity
coalesce_gap_hours: 12    # same-phenomenon alerts whose windows are this close go out as one push
forecast_days: 3
archive_retention_hours: 72  # how long past opportunities linger in the dashboard history

# Health. A quiet board is the normal case here, so it is indistinguishable
# from a broken pipeline unless something watches the clock.
digest_hour: 6               # local hour for the morning briefing (RWA_DIGEST_HOUR overrides)
stale_after_hours: 6         # no successful pass in this long = report the outage, not "nothing rare"
max_spot_failure_fraction: 0.34  # above this, abort the pass rather than publish a hollowed-out board

# Delivery. Secrets come from environment variables:
#   NTFY_TOPIC, PUSHOVER_TOKEN, PUSHOVER_USER
notify:
  ntfy_url: https://ntfy.sh
  # Every notification links here (Exceptional alerts deep-link to the card).
  # The DASHBOARD_URL env var, if set, overrides this.
  dashboard_url: https://stwils.github.io/rare-weather-alerts

paths:
  state: state/state.json
  thresholds: data/thresholds.json
  daily_scores: data/daily_scores.json
  raw_cache: data/raw
  greatest_hits: data/greatest_hits.md
  site: site        # generated dashboard, published to GitHub Pages

backfill:
  era5_start: "2016-07-01"          # 10 years for fog + sunrise/sunset
  forecast_archive_start: "2021-04-01"  # earliest with CAPE + 700hPa (storm light, lenticular)
