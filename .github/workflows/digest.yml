name: digest

# One morning briefing of the day's board. Reads the state committed by the
# hourly `alerts` run, and reports an outage if that state has gone stale.
#
# Cron is UTC and never shifts for daylight saving, so a single entry drifts an
# hour every winter. Fire at both candidate times and let `digest` gate on the
# *local* hour (settings.yaml: digest_hour) — exactly one of the two sends.
on:
  schedule:
    - cron: "10 13 * * *" # 06:10 PDT (summer) / 05:10 PST — sends in summer
    - cron: "10 14 * * *" # 07:10 PDT / 06:10 PST (winter) — sends in winter
  workflow_dispatch:
    inputs:
      force:
        description: "Send now, ignoring the local digest hour"
        type: boolean
        default: true

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Send daily digest
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          RWA_ROOT: ${{ github.workspace }}
        run: rare-weather digest ${{ inputs.force && '--force' || '' }}
